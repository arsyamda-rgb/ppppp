name: Build VeyrionWardrobe

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VeyrionWardrobe
        uses: actions/checkout@v6

      - name: Checkout VeyrionCharacter
        uses: actions/checkout@v6
        with:
          repository: arsyamda-rgb/ganteng-imut
          ref: main
          path: VeyrionCharacter

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and install VeyrionCharacter API
        run: mvn --batch-mode --no-transfer-progress -f VeyrionCharacter/pom.xml install

      - name: Build VeyrionWardrobe
        run: mvn --batch-mode --no-transfer-progress package

      - name: Upload VeyrionWardrobe JAR
        uses: actions/upload-artifact@v6
        with:
          name: VeyrionWardrobe
          path: target/VeyrionWardrobe-*.jar
          if-no-files-found: error
