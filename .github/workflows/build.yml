
name: Build Veyrion Plugins

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Project Structure
        run: |
          echo "=== POM FILES ==="
          find . -name pom.xml -not -path "*/target/*"

      - name: Build Maven Projects
        shell: bash
        run: |
          set -e

          mapfile -t POMS < <(
            find . -name pom.xml -not -path "*/target/*" | sort
          )

          if [ ${#POMS[@]} -eq 0 ]; then
            echo "ERROR: No pom.xml found!"
            exit 1
          fi

          for POM in "${POMS[@]}"; do
            DIR=$(dirname "$POM")
            echo "Building: $DIR"
            mvn --batch-mode -f "$POM" clean install
          done

      - name: Collect JAR Files
        run: |
          mkdir -p artifacts
          find . -path "*/target/*.jar" \
            -not -name "*-sources.jar" \
            -not -name "*-javadoc.jar" \
            -exec cp {} artifacts/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Veyrion-Build
          path: artifacts/*.jar
          if-no-files-found: error
